         x="50.335602"
         y="65.033684"
         id="tspan41">     <tspan
   style="font-size:19.7556px"
   id="tspan47">As a human being, I'm contstantly</tspan></tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:19.7556px;font-family:'Tw Cen MT';-inkscape-font-specification:'Tw Cen MT';fill:#5b524e;fill-opacity:1;stroke-width:0"
         x="50.335602"
